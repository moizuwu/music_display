[package]
name = "music_display"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Zero-flicker terminal now-playing display for MPRIS players: cover art, synced lyrics, chords, cava, optional Spotify Web API"
license = "MIT"

[lib]
name = "music_display"
path = "src/lib.rs"

[[bin]]
name = "music_display"
path = "src/main.rs"

[dependencies]
# TUI
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
# Kitty / Sixel / iTerm2 / halfblock image rendering. Default features pull in
# libchafa via pkg-config; we don't need it, so only enable what we use.
ratatui-image = { version = "11.1", default-features = false, features = ["crossterm", "image-defaults"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }

# Async runtime + plumbing
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "sync", "fs", "signal"] }
futures = "0.3"

# HTTP (MusicBrainz, iTunes, lrclib, cover art) — rustls, no OpenSSL dependency
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }

# Data / CLI
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
dirs = "6"
anyhow = "1"
unicode-width = "0.2"
toml = { version = "1.1.8", default-features = false, features = ["parse", "display", "serde"] }
lofty = "0.24.0"

# GUI (`--gui`), only with `--features gui`: the default build gets none of this
eframe = { version = "0.37", optional = true, default-features = false, features = [
    "glow", "wayland", "x11", "default_fonts", "system_fonts", "clipboard", "persistence",
] }
egui = { version = "0.37", optional = true, default-features = false }
# the installed font families, for the font picker in the Appearance tab (already in the tree via eframe)
fontique = { version = "0.11", optional = true }

[features]
default = []
gui = ["dep:eframe", "dep:egui", "dep:fontique"]

[lints.clippy]
# rust-version 1.90 (what the dependencies need) makes clippy suggest let chains for 19 nested
# `if let`s in code written before; collapse them in a separate cleanup, not here.
collapsible_if = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind" # keep unwind so the panic hook can restore the terminal

# Windows reads the system media session (SMTC) instead of playerctl
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Foundation",
    "Foundation_Collections",
    "Media",
    "Media_Control",
    "Storage_Streams",
    "Win32_System_WinRT",
] }
